spring.application.name=RepoRead

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash
#spring.ai.chat.client.enabled=false
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
#this is create table bydefault automatically i dont need to create Entity class
spring.ai.chat.memory.repository.jdbc.initialize-schema=ALWAYS

# OpenAI Base URL ko Groq API Endpoint par override karein
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.options.model=openai/gpt-oss-20b

#this is for embedding so we need embedding LLM model not simple model
spring.ai.model.embedding=google-genai
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=768

spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true
# Custom table name for PgVector
spring.ai.vectorstore.pgvector.table-name=repo_document_3
spring.ai.vectorstore.pgvector.distance-type = COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type = HNSW

#this for check llm request and response that give llm
logging.level.org.springframework.ai.chat.client.advisor=debug

